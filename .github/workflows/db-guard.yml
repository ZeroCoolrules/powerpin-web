name: Database Zero-Trust Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  db-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supabase DB Lint (fail on ERROR)
        run: |
          supabase db lint --level error

      - name: Schema Drift Check
        run: |
          supabase db diff --use-migra
          
      - name: Ensure RLS enabled everywhere
        run: |
          supabase db lint --lint 0013_rls_disabled_in_public
