name: Qpids Place Android app

# Builds the Android app in mobile/. Every run gives a test APK you can install
# on a phone. When the upload key secrets are set, it also gives a signed
# .aab file ready to upload to Google Play.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to members, e.g. 1.0"
        default: "1.0"
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-app.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android-app.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      QPIDS_VERSION_CODE: ${{ github.run_number }}
      QPIDS_VERSION_NAME: ${{ inputs.version_name || '1.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and sync the app shell
        run: |
          npm ci
          npx cap sync android

      - name: Build test APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: qpids-place-test-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Check for the upload key
        id: key
        env:
          KEYSTORE: ${{ secrets.QPIDS_KEYSTORE_BASE64 }}
        run: if [ -n "$KEYSTORE" ]; then echo "present=true"; else echo "present=false"; fi >> "$GITHUB_OUTPUT"

      - name: Build signed bundle for Google Play
        if: steps.key.outputs.present == 'true' && github.event_name != 'pull_request'
        working-directory: mobile/android
        env:
          QPIDS_KEYSTORE_BASE64: ${{ secrets.QPIDS_KEYSTORE_BASE64 }}
          QPIDS_KEYSTORE_PASSWORD: ${{ secrets.QPIDS_KEYSTORE_PASSWORD }}
          QPIDS_KEY_ALIAS: ${{ secrets.QPIDS_KEY_ALIAS }}
          QPIDS_KEY_PASSWORD: ${{ secrets.QPIDS_KEY_PASSWORD }}
        run: |
          export QPIDS_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$QPIDS_KEYSTORE_BASE64" | base64 --decode > "$QPIDS_KEYSTORE_FILE"
          ./gradlew --no-daemon bundleRelease
          rm -f "$QPIDS_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true' && github.event_name != 'pull_request'
        with:
          name: qpids-place-play-bundle
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
